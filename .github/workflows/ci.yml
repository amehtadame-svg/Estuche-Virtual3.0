name: CI

on: [pull_request]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: be/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: be
      - run: pnpm test
        working-directory: be

  incidenthub-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: incidenthub-api/package-lock.json
      - run: npm ci
        working-directory: incidenthub-api
      - run: npm test
        working-directory: incidenthub-api
