<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" xmlns="http://www.w3.org/2000/svg" width="1240" height="1070" viewBox="0 0 1240 1070" role="img" aria-label="Secuencia de compra académica y reserva transaccional"><ns0:rect x="0" y="0" width="1240" height="1070" fill="#f7f9fc"/><ns0:text x="32" y="42" fill="#1b3048" font-size="25" text-anchor="start" font-family="Arial, sans-serif" font-weight="bold">Secuencia de compra · simulación académica</ns0:text><ns0:text x="32" y="68" fill="#1b3048" font-size="15" text-anchor="start" font-family="Arial, sans-serif" font-weight="normal">Vista del checkout de demostración; no es una integración bancaria real.</ns0:text><ns0:defs><ns0:marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><ns0:path d="M 0 0 L 10 5 L 0 10 z" fill="#335e80"/></ns0:marker></ns0:defs><ns0:rect x="16" y="92" width="198" height="48" rx="9" fill="#e4edfa" stroke="#85a5bf"/><ns0:text x="115" y="121" fill="#1b3048" font-size="15" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold">Cliente</ns0:text><ns0:line x1="115" y1="140" x2="115" y2="984" stroke="#a7b8c8" stroke-dasharray="5 5"/><ns0:rect x="281" y="92" width="198" height="48" rx="9" fill="#e4edfa" stroke="#85a5bf"/><ns0:text x="380" y="121" fill="#1b3048" font-size="15" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold">Checkout / carrito</ns0:text><ns0:line x1="380" y1="140" x2="380" y2="984" stroke="#a7b8c8" stroke-dasharray="5 5"/><ns0:rect x="546" y="92" width="198" height="48" rx="9" fill="#e4edfa" stroke="#85a5bf"/><ns0:text x="645" y="121" fill="#1b3048" font-size="15" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold">API Express</ns0:text><ns0:line x1="645" y1="140" x2="645" y2="984" stroke="#a7b8c8" stroke-dasharray="5 5"/><ns0:rect x="826" y="92" width="198" height="48" rx="9" fill="#e4edfa" stroke="#85a5bf"/><ns0:text x="925" y="121" fill="#1b3048" font-size="15" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold">Servicio de pagos</ns0:text><ns0:line x1="925" y1="140" x2="925" y2="984" stroke="#a7b8c8" stroke-dasharray="5 5"/><ns0:rect x="1041" y="92" width="198" height="48" rx="9" fill="#e4edfa" stroke="#85a5bf"/><ns0:text x="1140" y="121" fill="#1b3048" font-size="15" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold">PostgreSQL</ns0:text><ns0:line x1="1140" y1="140" x2="1140" y2="984" stroke="#a7b8c8" stroke-dasharray="5 5"/><ns0:line x1="115" y1="180" x2="380" y2="180" stroke="#335e80" stroke-width="1.6" marker-end="url(#arrow)"/><ns0:text x="247.5" y="172" fill="#1b3048" font-size="13" text-anchor="middle" font-family="Arial, sans-serif" font-weight="normal">Revisar carrito, entrega y medio</ns0:text><ns0:line x1="380" y1="230" x2="645" y2="230" stroke="#335e80" stroke-width="1.6" marker-end="url(#arrow)"/><ns0:text x="512.5" y="222" fill="#1b3048" font-size="13" text-anchor="middle" font-family="Arial, sans-serif" font-weight="normal">GET /api/payments/config</ns0:text><ns0:line x1="645" y1="270" x2="380" y2="270" stroke="#335e80" stroke-width="1.6" marker-end="url(#arrow)" stroke-dasharray="5 4"/><ns0:text x="512.5" y="262" fill="#1b3048" font-size="13" text-anchor="middle" font-family="Arial, sans-serif" font-weight="normal">Disponibilidad de simulación</ns0:text><ns0:line x1="380" y1="320" x2="645" y2="320" stroke="#335e80" stroke-width="1.6" marker-end="url(#arrow)"/><ns0:text x="512.5" y="312" fill="#1b3048" font-size="10" text-anchor="middle" font-family="Arial, sans-serif" font-weight="normal">Opcional: POST /api/promotional-codes/validate</ns0:text><ns0:line x1="645" y1="360" x2="380" y2="360" stroke="#335e80" stroke-width="1.6" marker-end="url(#arrow)" stroke-dasharray="5 4"/><ns0:text x="512.5" y="352" fill="#1b3048" font-size="13" text-anchor="middle" font-family="Arial, sans-serif" font-weight="normal">Cotización calculada por el servidor</ns0:text><ns0:line x1="115" y1="410" x2="380" y2="410" stroke="#335e80" stroke-width="1.6" marker-end="url(#arrow)"/><ns0:text x="247.5" y="402" fill="#1b3048" font-size="13" text-anchor="middle" font-family="Arial, sans-serif" font-weight="normal">Confirmar simulación</ns0:text><ns0:line x1="380" y1="455" x2="645" y2="455" stroke="#335e80" stroke-width="1.6" marker-end="url(#arrow)"/><ns0:text x="512.5" y="447" fill="#1b3048" font-size="10" text-anchor="middle" font-family="Arial, sans-serif" font-weight="normal">POST /api/payments/demo/checkout + requestKey</ns0:text><ns0:line x1="645" y1="500" x2="925" y2="500" stroke="#335e80" stroke-width="1.6" marker-end="url(#arrow)"/><ns0:text x="785.0" y="492" fill="#1b3048" font-size="10" text-anchor="middle" font-family="Arial, sans-serif" font-weight="normal">Verificar sesión, esquema y habilitación</ns0:text><ns0:line x1="925" y1="545" x2="1140" y2="545" stroke="#335e80" stroke-width="1.6" marker-end="url(#arrow)"/><ns0:text x="1032.5" y="537" fill="#1b3048" font-size="10" text-anchor="middle" font-family="Arial, sans-serif" font-weight="normal">Transacción: idempotencia, precios, stock y cupón</ns0:text><ns0:line x1="925" y1="595" x2="1140" y2="595" stroke="#335e80" stroke-width="1.6" marker-end="url(#arrow)"/><ns0:text x="1032.5" y="587" fill="#1b3048" font-size="10" text-anchor="middle" font-family="Arial, sans-serif" font-weight="normal">Reservar stock; crear pedido, recibo y pago pendiente</ns0:text><ns0:line x1="925" y1="645" x2="1140" y2="645" stroke="#335e80" stroke-width="1.6" marker-end="url(#arrow)"/><ns0:text x="1032.5" y="637" fill="#1b3048" font-size="10" text-anchor="middle" font-family="Arial, sans-serif" font-weight="normal">Actualizar perfil, carrito y evento; resolver si corresponde</ns0:text><ns0:line x1="1140" y1="695" x2="925" y2="695" stroke="#335e80" stroke-width="1.6" marker-end="url(#arrow)" stroke-dasharray="5 4"/><ns0:text x="1032.5" y="687" fill="#1b3048" font-size="13" text-anchor="middle" font-family="Arial, sans-serif" font-weight="normal">Commit o rollback completo</ns0:text><ns0:line x1="925" y1="735" x2="645" y2="735" stroke="#335e80" stroke-width="1.6" marker-end="url(#arrow)" stroke-dasharray="5 4"/><ns0:text x="785.0" y="727" fill="#1b3048" font-size="13" text-anchor="middle" font-family="Arial, sans-serif" font-weight="normal">Resultado o error</ns0:text><ns0:line x1="645" y1="775" x2="380" y2="775" stroke="#335e80" stroke-width="1.6" marker-end="url(#arrow)" stroke-dasharray="5 4"/><ns0:text x="512.5" y="767" fill="#1b3048" font-size="13" text-anchor="middle" font-family="Arial, sans-serif" font-weight="normal">Respuesta con estado y referencia</ns0:text><ns0:line x1="380" y1="815" x2="115" y2="815" stroke="#335e80" stroke-width="1.6" marker-end="url(#arrow)" stroke-dasharray="5 4"/><ns0:text x="247.5" y="807" fill="#1b3048" font-size="10" text-anchor="middle" font-family="Arial, sans-serif" font-weight="normal">Mostrar resultado y sincronizar carrito</ns0:text><ns0:line x1="380" y1="865" x2="645" y2="865" stroke="#335e80" stroke-width="1.6" marker-end="url(#arrow)"/><ns0:text x="512.5" y="857" fill="#1b3048" font-size="10" text-anchor="middle" font-family="Arial, sans-serif" font-weight="normal">Pendiente: GET /demo/:key o POST /demo/:key/resolve</ns0:text><ns0:line x1="645" y1="910" x2="925" y2="910" stroke="#335e80" stroke-width="1.6" marker-end="url(#arrow)"/><ns0:text x="785.0" y="902" fill="#1b3048" font-size="10" text-anchor="middle" font-family="Arial, sans-serif" font-weight="normal">Verificar titularidad y resolver bajo bloqueo</ns0:text><ns0:text x="32" y="1015" fill="#1b3048" font-size="14" text-anchor="start" font-family="Arial, sans-serif" font-weight="normal">El pago puede quedar pendiente, aprobado o rechazado. No se solicitan claves ni datos bancarios.</ns0:text><ns0:text x="32" y="1044" fill="#1b3048" font-size="13" text-anchor="start" font-family="Arial, sans-serif" font-weight="normal">Referencia técnica: be/src/modules/payments/payments.service.ts y fe/src/pages/Checkout/useDemoPayment.ts.</ns0:text></ns0:svg>