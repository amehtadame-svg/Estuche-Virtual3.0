<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Estuche Virtual</title>
  <desc>Banner del proyecto Estuche Virtual, plataforma e-commerce de útiles escolares, en la paleta morada de la marca</desc>

  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5eeff"/>
      <stop offset="60%" stop-color="#fdf8ff"/>
      <stop offset="100%" stop-color="#f0e6ff"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="300" fill="url(#bgGrad)"/>

  <!-- soft decorative circles -->
  <circle cx="1120" cy="40" r="90" fill="#c084fc" opacity="0.18"/>
  <circle cx="60" cy="270" r="70" fill="#8b1fe8" opacity="0.12"/>

  <!-- notebook -->
  <g transform="translate(80,60)">
    <rect x="0" y="0" width="150" height="180" rx="10" fill="#ffffff" stroke="#8b1fe8" stroke-width="3"/>
    <rect x="0" y="0" width="26" height="180" rx="10" fill="url(#accentGrad)"/>
    <circle cx="13" cy="35" r="4" fill="#ffffff"/>
    <circle cx="13" cy="65" r="4" fill="#ffffff"/>
    <circle cx="13" cy="95" r="4" fill="#ffffff"/>
    <circle cx="13" cy="125" r="4" fill="#ffffff"/>
    <circle cx="13" cy="155" r="4" fill="#ffffff"/>
    <line x1="45" y1="40" x2="130" y2="40" stroke="#e5d4fa" stroke-width="3"/>
    <line x1="45" y1="70" x2="130" y2="70" stroke="#e5d4fa" stroke-width="3"/>
    <line x1="45" y1="100" x2="130" y2="100" stroke="#e5d4fa" stroke-width="3"/>
    <line x1="45" y1="130" x2="110" y2="130" stroke="#e5d4fa" stroke-width="3"/>
  </g>

  <!-- pencils -->
  <g transform="translate(250,230) rotate(-35)">
    <rect x="0" y="0" width="130" height="20" fill="#aa3bff"/>
    <polygon points="130,0 155,10 130,20" fill="#f0d9ff"/>
    <polygon points="145,7 155,10 145,13" fill="#3a3a3a"/>
    <rect x="0" y="0" width="12" height="20" fill="#e85c9c"/>
  </g>
  <g transform="translate(230,255) rotate(-35)">
    <rect x="0" y="0" width="110" height="16" fill="#c084fc"/>
    <polygon points="110,0 132,8 110,16" fill="#f0d9ff"/>
    <polygon points="122,5 132,8 122,11" fill="#3a3a3a"/>
    <rect x="0" y="0" width="10" height="16" fill="#e85c9c"/>
  </g>

  <!-- ruler -->
  <g transform="translate(150,20) rotate(12)">
    <rect x="0" y="0" width="140" height="22" rx="3" fill="#e5d4fa" stroke="#8b1fe8" stroke-width="1.5"/>
    <line x1="10" y1="0" x2="10" y2="10" stroke="#8b1fe8" stroke-width="1.5"/>
    <line x1="30" y1="0" x2="30" y2="14" stroke="#8b1fe8" stroke-width="1.5"/>
    <line x1="50" y1="0" x2="50" y2="10" stroke="#8b1fe8" stroke-width="1.5"/>
    <line x1="70" y1="0" x2="70" y2="14" stroke="#8b1fe8" stroke-width="1.5"/>
    <line x1="90" y1="0" x2="90" y2="10" stroke="#8b1fe8" stroke-width="1.5"/>
    <line x1="110" y1="0" x2="110" y2="14" stroke="#8b1fe8" stroke-width="1.5"/>
  </g>

  <!-- text block -->
  <text x="460" y="145" font-family="Georgia, 'Times New Roman', serif" font-size="58" font-weight="700" fill="#4a0d8f" letter-spacing="1">Estuche Virtual</text>
  <text x="462" y="182" font-family="'Trebuchet MS', Verdana, sans-serif" font-size="21" fill="#8b1fe8">Tu papelería escolar, ahora en línea</text>
  <rect x="462" y="196" width="230" height="4" rx="2" fill="url(#accentGrad)"/>

  <!-- small accent icons on the right -->
  <g transform="translate(1010,70)">
    <rect x="0" y="0" width="60" height="80" rx="8" fill="#ffffff" stroke="#aa3bff" stroke-width="3"/>
    <line x1="12" y1="20" x2="48" y2="20" stroke="#e5d4fa" stroke-width="3"/>
    <line x1="12" y1="35" x2="48" y2="35" stroke="#e5d4fa" stroke-width="3"/>
    <line x1="12" y1="50" x2="38" y2="50" stroke="#e5d4fa" stroke-width="3"/>
  </g>
  <g transform="translate(1100,90)">
    <circle cx="0" cy="0" r="26" fill="url(#accentGrad)"/>
    <path d="M-10,4 L-2,12 L14,-8" stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
