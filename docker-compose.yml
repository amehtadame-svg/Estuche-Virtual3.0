name: estuche-virtual

services:
  db:
    image: postgres:16-alpine
    container_name: estuche-db
    restart: unless-stopped
    network_mode: host
    environment:
      POSTGRES_USER: estuche_user
      POSTGRES_PASSWORD: estuche_pass
      POSTGRES_DB: estuche_virtual
    volumes:
      - ./db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U estuche_user -d estuche_virtual"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: ./be
      dockerfile: Dockerfile
    container_name: estuche-backend
    restart: unless-stopped
    network_mode: host
    environment:
      - PORT=4000
      - JWT_SECRET=your-super-secret-access-key-min-32-chars-change-in-production
    command: ["sh", "/app/docker-entrypoint.sh"]
    volumes:
      - ./be:/app
      - be_node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./fe
      dockerfile: Dockerfile
    container_name: estuche-frontend
    restart: unless-stopped
    network_mode: host
    command: pnpm dev --host 0.0.0.0
    volumes:
      - ./fe:/app
      - fe_node_modules:/app/node_modules
    depends_on:
      - backend

  adminer:
    image: adminer:latest
    container_name: estuche-adminer
    restart: unless-stopped
    network_mode: host
    depends_on:
      - db

volumes:
  be_node_modules:
  fe_node_modules: