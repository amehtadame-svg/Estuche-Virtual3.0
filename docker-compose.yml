name: estuche-virtual

services:
  db:
    image: postgres:16-alpine
    container_name: estuche-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: estuche_user
      POSTGRES_PASSWORD: estuche_pass
      POSTGRES_DB: estuche_virtual
    volumes:
      - ./db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U estuche_user -d estuche_virtual"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build:
      context: ./be
      dockerfile: Dockerfile
    container_name: estuche-backend
    restart: unless-stopped
    environment:
      PORT: "4000"
      # Base principal (Supabase). Se resuelve desde el .env de la raíz o desde
      # un Codespaces secret con el mismo nombre. Si no existe, Compose falla
      # con un mensaje claro en vez de dejar el backend sin URL.
      DATABASE_URL: ${SUPABASE_DATABASE_URL:?Falta SUPABASE_DATABASE_URL. Define un Codespaces secret o crea el .env de la raiz (ver .env-example).}
      # Base local de respaldo. Reservada para la fase offline: todavia no la
      # lee ningun codigo. Por defecto apunta al servicio db de este compose.
      LOCAL_DATABASE_URL: ${LOCAL_DATABASE_URL:-postgresql://estuche_user:estuche_pass@db:5432/estuche_virtual}
      JWT_SECRET: ${JWT_SECRET:?Falta JWT_SECRET. Define un Codespaces secret o crea el .env de la raiz (ver .env-example).}
      CORS_ORIGINS: "http://localhost:5173,https://*.app.github.dev"
      RATE_LIMIT_MAX: "100"
      RATE_LIMIT_WINDOW_MS: "900000"
      # Correo (recuperacion de contrasena). Si van vacios, el backend usa la
      # cuenta de prueba Ethereal y el enlace del codigo aparece en los logs.
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_PASS: ${EMAIL_PASS:-}
    command: sh -c "pnpm prisma generate && pnpm dev"
    volumes:
      - ./be:/app
      - be_node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "4000:4000"

  frontend:
    build:
      context: ./fe
      dockerfile: Dockerfile
    container_name: estuche-frontend
    restart: unless-stopped
    command: pnpm dev --host 0.0.0.0
    volumes:
      - ./fe:/app
      - fe_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  be_node_modules:
  fe_node_modules:
