name: estuche-virtual

services:
  db:
    image: postgres:16-alpine
    container_name: estuche-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: estuche_user
      POSTGRES_PASSWORD: estuche_pass
      POSTGRES_DB: estuche_virtual
    volumes:
      - ./db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U estuche_user -d estuche_virtual"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./be
      dockerfile: Dockerfile
    container_name: estuche-backend
    restart: unless-stopped
    environment:
      - PORT=4000
      - DATABASE_URL=postgresql://estuche_user:estuche_pass@db:5432/estuche_virtual
      - JWT_SECRET=your-super-secret-access-key-min-32-chars-change-in-production
      - CORS_ORIGINS=http://localhost:5173,https://*.app.github.dev
      - RATE_LIMIT_MAX=100
      - RATE_LIMIT_WINDOW_MS=900000
    command: sh -c "pnpm prisma generate && pnpm prisma migrate deploy && pnpm prisma db seed && pnpm dev"
    volumes:
      - ./be:/app
      - be_node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "4000:4000"

  frontend:
    build:
      context: ./fe
      dockerfile: Dockerfile
    container_name: estuche-frontend
    restart: unless-stopped
    command: pnpm dev --host 0.0.0.0
    volumes:
      - ./fe:/app
      - fe_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  be_node_modules:
  fe_node_modules: