name: estuche-virtual

services:
  db:
    image: postgres:16-alpine
    container_name: estuche-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: estuche_user
      POSTGRES_PASSWORD: estuche_pass
      POSTGRES_DB: estuche_virtual
    volumes:
      - ./db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U estuche_user -d estuche_virtual"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build:
      context: ./be
      dockerfile: Dockerfile
    container_name: estuche-backend
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PORT: "4000"
      DATABASE_URL: ${SUPABASE_DATABASE_URL}
      LOCAL_DATABASE_URL: ${LOCAL_DATABASE_URL}
      JWT_SECRET: your-super-secret-access-key-min-32-chars-change-in-production
      CORS_ORIGINS: "http://localhost:5173,https://*.app.github.dev"
      RATE_LIMIT_MAX: "100"
      RATE_LIMIT_WINDOW_MS: "900000"
    command: sh -c "pnpm prisma generate && pnpm dev"
    volumes:
      - ./be:/app
      - be_node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "4000:4000"

  frontend:
    build:
      context: ./fe
      dockerfile: Dockerfile
    container_name: estuche-frontend
    restart: unless-stopped
    command: pnpm dev --host 0.0.0.0
    volumes:
      - ./fe:/app
      - fe_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  be_node_modules:
  fe_node_modules:

networks:
  default:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_icc: "true"