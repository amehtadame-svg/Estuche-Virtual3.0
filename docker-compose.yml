name: estuche-virtual

services:
  db:
    image: postgres:16-alpine
    container_name: estuche-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: estuche_user
      POSTGRES_PASSWORD: estuche_pass
      POSTGRES_DB: estuche_virtual
    # El volumen es lo que hace que los datos sobrevivan a `docker compose down`.
    # Solo `docker compose down -v` (o borrar db_data/) los destruye.
    volumes:
      - ./db_data:/var/lib/postgresql/data
    networks:
      - estuche
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U estuche_user -d estuche_virtual"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 30s

  backend:
    build:
      context: ./be
      dockerfile: Dockerfile
    container_name: estuche-backend
    restart: unless-stopped
    environment:
      - PORT=4000
      # Dentro de la red de Compose la base se alcanza por el nombre del
      # servicio, no por 127.0.0.1 (que antes solo funcionaba con
      # network_mode: host, inexistente en Docker Desktop para Win/Mac).
      - DATABASE_URL=postgresql://estuche_user:estuche_pass@db:5432/estuche_virtual
      - JWT_SECRET=your-super-secret-access-key-min-32-chars-change-in-production
      - CORS_ORIGINS=http://localhost:5173,http://localhost:4173,https://*.app.github.dev,https://*.e2b.app
      - RATE_LIMIT_MAX=100
      - RATE_LIMIT_WINDOW_MS=900000
      - RUN_SEED=true
    command: ["sh", "/app/docker-entrypoint.sh"]
    volumes:
      - ./be:/app
      - be_node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "4000:4000"
    networks:
      - estuche

  frontend:
    build:
      context: ./fe
      dockerfile: Dockerfile
    container_name: estuche-frontend
    restart: unless-stopped
    environment:
      # El navegador es quien llama al API: para él el backend vive en
      # localhost:4000 (puerto publicado por el servicio backend).
      - VITE_API_URL=http://localhost:4000
      # El proxy de Vite vive DENTRO del contenedor: ahí el backend es
      # http://backend:4000 (nombre del servicio).
      - VITE_PROXY_TARGET=http://backend:4000
    command: pnpm dev --host 0.0.0.0
    volumes:
      - ./fe:/app
      - fe_node_modules:/app/node_modules
    depends_on:
      - backend
    ports:
      - "5173:5173"
    networks:
      - estuche

volumes:
  be_node_modules:
  fe_node_modules:

networks:
  estuche:
    driver: bridge
