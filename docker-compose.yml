name: estuche-virtual

services:
  db:
    image: postgres:17-alpine
    container_name: estuche-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: estuche_user
      POSTGRES_PASSWORD: estuche_pass
      POSTGRES_DB: estuche_virtual
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U estuche_user -d estuche_virtual"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./be
      dockerfile: Dockerfile
    container_name: estuche-backend
    restart: unless-stopped
    env_file:
      - ./be/.env
    command: sh -c "pnpm prisma generate && pnpm dev"
    volumes:
      - ./be:/app
      - be_node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "4000:4000"

  frontend:
    build:
      context: ./fe
      dockerfile: Dockerfile
    container_name: estuche-frontend
    restart: unless-stopped
    command: pnpm dev --host 0.0.0.0
    volumes:
      - ./fe:/app
      - fe_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  be_node_modules:
  fe_node_modules:
  db_data: